# config/mcp.yaml — MCP server configuration (version-controlled subset)
# Merged into ~/.hermes/config.yaml via scripts/sync-config.sh --sync-mcp
#
# Model Context Protocol (MCP) servers provide additional tools to Hermes.
# Each server runs as a subprocess (stdio) or connects via HTTP.
# After adding a server, restart Hermes or run /reload-skills.
#
# Prerequisites:
#   - stdio servers: npx (Node.js) or uvx (Python) must be installed
#   - HTTP servers: the server must be running and reachable
#   - API keys: set in .env, referenced via ${ENV_VAR} syntax
#
# Docs: https://hermes-agent.nousresearch.com/docs/guides/use-mcp-with-hermes

# ---------------------------------------------------------------------------
# MCP Servers — uncomment and configure to activate
# ---------------------------------------------------------------------------
